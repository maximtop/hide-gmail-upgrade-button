<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hide Upgrade Button</title>
    <style>
        :root {
            --bg: #f6f7f8;
            --surface: #ffffff;
            --fg: #1b1b1f;
            --muted: #6b7280;
            --accent: #0f766e;
            --accent-strong: #0d675f;
            --on-accent: #ffffff;
            --accent-soft: rgba(15, 118, 110, 0.08);
            --divider: #e5e7eb;
            /* Illustration tokens: a neutral "Google header" drawn in the page's
               own theme, so dark mode needs no light frame. */
            --bar: #ffffff;
            --bar-border: #e5e7eb;
            --glyph: #5f6368;
            --field: #eef1f4;
            --avatar: #c4c9d0;
            --pill-bg: #dbeafe;
            --pill-fg: #1d4ed8;
            --removed: #dc2626;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181a;
                --surface: #1e1f22;
                --fg: #e6e6ea;
                --muted: #9ca3af;
                --accent: #14b8a6;
                --accent-strong: #2dd4bf;
                --on-accent: #0b1f1d;
                --accent-soft: rgba(45, 212, 191, 0.1);
                --divider: #33353a;
                --bar: #26282c;
                --bar-border: #3a3d42;
                --glyph: #aeb3ba;
                --field: #33363b;
                --avatar: #5b616a;
                --pill-bg: #1e3a5f;
                --pill-fg: #93c5fd;
                --removed: #f87171;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--fg);
            background: var(--bg);
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 24px 40px;
        }

        p { margin: 0; }

        /* ---------- Header ---------- */
        header {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        header svg { flex: none; border-radius: 9px; }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
        }
        .intro {
            margin: 10px 0 20px;
            color: var(--muted);
        }

        /* ---------- Before/after illustration ---------- */
        .compare {
            margin: 0 0 16px;
            padding: 16px 20px 18px;
            border: 1px solid var(--divider);
            border-radius: 12px;
            background: var(--surface);
        }
        .compare-label {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .compare-label.after { margin-top: 14px; color: var(--accent); }
        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--bar-border);
            border-radius: 10px;
            background: var(--bar);
        }
        .bar svg { flex: none; display: block; }
        .bar .logo { width: 22px; height: 22px; border-radius: 5px; background: var(--field); flex: none; }
        .bar .search {
            flex: 0 1 220px;
            height: 28px;
            border-radius: 14px;
            background: var(--field);
            display: flex;
            align-items: center;
            padding-inline-start: 10px;
        }
        .bar .spacer { flex: 1; }
        .removed {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: -4px 0;
            padding: 3px 6px;
            border: 2px dashed var(--removed);
            border-radius: 9px;
        }
        .pill {
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--pill-bg);
            color: var(--pill-fg);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--avatar); flex: none; }

        /* ---------- Cards ---------- */
        section {
            display: flex;
            align-items: center;
            gap: 16px 24px;
            flex-wrap: wrap;
            padding: 20px 24px;
            margin-bottom: 12px;
            border: 1px solid var(--divider);
            border-radius: 12px;
            background: var(--surface);
        }
        section.primary-card { border-color: var(--accent); }
        .card-body { flex: 1 1 280px; min-width: 0; }
        h2 {
            margin: 0 0 4px;
            font-size: 16.5px;
            font-weight: 600;
        }
        .card-text { color: var(--fg); }
        .card-action { flex: none; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
        .why { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
        .why summary { cursor: pointer; color: var(--accent); width: fit-content; }
        .why summary:hover { text-decoration: underline; }
        .why p { margin-top: 4px; }
        .hint {
            margin-top: 8px;
            font-size: 13.5px;
            color: var(--muted);
        }

        button {
            font: inherit;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 9px;
            cursor: pointer;
            white-space: normal;
        }
        .primary { border: 1px solid var(--accent); color: var(--on-accent); background: var(--accent); }
        .primary:hover { background: var(--accent-strong); }
        .secondary { border: 1px solid var(--divider); color: var(--fg); background: transparent; padding: 7px 14px; }
        .secondary:hover { background: var(--accent-soft); }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: var(--accent);
        }

        /* Pin illustration: toolbar end with the Extensions (puzzle) button and
           its menu row. Icons only, no text. Laid out with flex, so it mirrors
           itself in RTL; glyphs are not flipped. */
        .pin-art {
            flex: none;
            width: 168px;
            padding: 10px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--divider);
        }
        .pin-art .toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            height: 26px;
            padding: 0 6px;
            border-radius: 7px;
            background: var(--bar);
            border: 1px solid var(--bar-border);
        }
        .pin-art .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--field); }
        .pin-art .puzzle {
            display: grid;
            place-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--accent);
            color: var(--glyph);
        }
        .pin-art .menu {
            margin-top: 6px;
            margin-inline-start: 18px;
            display: flex;
            align-items: center;
            gap: 7px;
            height: 30px;
            padding: 0 8px;
            border-radius: 7px;
            background: var(--bar);
            border: 1px solid var(--bar-border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .pin-art .menu svg { flex: none; }
        .pin-art .name { flex: 1; height: 7px; border-radius: 4px; background: var(--field); }
        .pin-art .pin { color: var(--accent); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }

        /* ---------- Footer ---------- */
        footer {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            margin-top: 20px;
            padding: 0 4px;
            font-size: 13.5px;
            color: var(--muted);
        }
        footer .privacy { flex: 1 1 100%; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ---------- Async-backed state ---------- */
        /* Parts that depend on the browser's permission or toolbar state stay
           hidden and non-interactive, with their layout preserved, until that
           state is applied. */
        [data-pending] .state {
            visibility: hidden;
            pointer-events: none;
        }

        [hidden] {
            display: none !important;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .primary:hover:disabled {
            background: var(--accent);
        }

        button:focus-visible,
        summary:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent-strong);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <svg width="40" height="40" viewBox="0 0 128 128" aria-hidden="true">
                <rect width="128" height="128" rx="28" fill="#0F766E"/>
                <rect x="26" y="52" width="76" height="24" rx="12" fill="#FFFFFF"/>
                <line x1="34" y1="98" x2="94" y2="30" stroke="#0F766E" stroke-width="16" stroke-linecap="round"/>
                <line x1="34" y1="98" x2="94" y2="30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
            </svg>
            <h1 data-i18n="onboarding_title"></h1>
        </header>
        <p class="intro" data-i18n="onboarding_intro"></p>

        <figure class="compare" role="img" data-i18n-aria-label="onboarding_how_image_alt">
                <p class="compare-label" data-i18n="onboarding_before"></p>
                <div class="bar">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="var(--glyph)" stroke-width="2.2" stroke-linecap="round"/></svg>
                    <span class="logo"></span>
                    <span class="search"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="var(--glyph)" stroke-width="2.4"/><path d="M15 15l5 5" stroke="var(--glyph)" stroke-width="2.4" stroke-linecap="round"/></svg></span>
                    <span class="spacer"></span>
                    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--glyph)" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4" fill="none" stroke="var(--glyph)" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="var(--glyph)"/></svg>
                    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="var(--glyph)" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="var(--glyph)" stroke-width="2" stroke-linecap="round"/></svg>
                    <span class="removed">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z" fill="var(--glyph)"/></svg>
                        <span class="pill">Upgrade</span>
                    </span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--glyph)"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
                    <span class="avatar"></span>
                </div>
                <p class="compare-label after" data-i18n="onboarding_after"></p>
                <div class="bar">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="var(--glyph)" stroke-width="2.2" stroke-linecap="round"/></svg>
                    <span class="logo"></span>
                    <span class="search"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="var(--glyph)" stroke-width="2.4"/><path d="M15 15l5 5" stroke="var(--glyph)" stroke-width="2.4" stroke-linecap="round"/></svg></span>
                    <span class="spacer"></span>
                    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--glyph)" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4" fill="none" stroke="var(--glyph)" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="var(--glyph)"/></svg>
                    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="var(--glyph)" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="var(--glyph)" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--glyph)"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
                    <span class="avatar"></span>
                </div>
            </figure>

        <section class="primary-card" id="calendar-card" data-pending>
            <div class="card-body">
                <h2 data-i18n="onboarding_calendar_heading"></h2>
                <div class="state">
                    <p class="card-text" id="calendar-text-off" data-i18n="onboarding_calendar_text"></p>
                    <p class="card-text" id="calendar-text-on" data-i18n="onboarding_calendar_text_on" hidden></p>
                    <p class="hint" id="calendar-denied" data-i18n="onboarding_calendar_denied" hidden></p>
                    <details class="why" id="calendar-why">
                        <summary data-i18n="onboarding_calendar_why_toggle"></summary>
                        <p data-i18n="onboarding_calendar_why"></p>
                    </details>
                </div>
            </div>
            <div class="card-action state">
                <button type="button" class="primary" id="calendar-enable" data-i18n="popup_calendar_access_label" disabled></button>
                <span class="status" id="calendar-enabled" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span data-i18n="onboarding_calendar_enabled"></span>
                </span>
                <button type="button" class="secondary" id="calendar-disable" data-i18n="onboarding_calendar_disable" hidden disabled></button>
            </div>
        </section>

        <section id="pin-card" data-pending>
            <div class="card-body">
                <h2 data-i18n="onboarding_pin_heading"></h2>
                <div class="state">
                    <p class="card-text" id="pin-text" data-i18n="onboarding_pin_text"></p>
                    <p class="card-text" id="pin-done-text" data-i18n="onboarding_pin_done_text" hidden></p>
                </div>
            </div>
            <div class="card-action state">
                <div class="pin-art" id="pin-art" aria-hidden="true">
                            <div class="toolbar">
                                <span class="dot"></span>
                                <span class="puzzle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg></span>
                                <span class="dot"></span>
                            </div>
                            <div class="menu">
                                <svg width="16" height="16" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#0F766E"/><rect x="26" y="52" width="76" height="24" rx="12" fill="#FFFFFF"/><line x1="34" y1="98" x2="94" y2="30" stroke="#0F766E" stroke-width="16" stroke-linecap="round"/><line x1="34" y1="98" x2="94" y2="30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></svg>
                                <span class="name"></span>
                                <span class="pin"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3l5 5-2 1-3.5 3.5.5 4.5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 4.5.5L15 5z"/></svg></span>
                            </div>
                        </div>
                <span class="status" id="pin-done" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span data-i18n="onboarding_pin_done"></span>
                </span>
            </div>
        </section>

        <footer>
            <a href="https://github.com/maximtop/hide-gmail-upgrade-button/issues/new" target="_blank" rel="noreferrer" data-i18n="onboarding_report_link"></a>
            <a href="<%= storeListingUrl %>" target="_blank" rel="noreferrer" data-i18n="onboarding_rate_link"></a>
            <p class="privacy">
                <span data-i18n="onboarding_privacy_text"></span>
                <a href="https://github.com/maximtop/hide-gmail-upgrade-button/blob/master/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="onboarding_privacy_link"></a>
            </p>
        </footer>
    </main>
</body>
</html>
