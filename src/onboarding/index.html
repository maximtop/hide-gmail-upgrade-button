<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hide Upgrade Button</title>
    <style>
        :root {
            --bg: #f6f7f8;
            --surface: #ffffff;
            --fg: #1b1b1f;
            --muted: #6b7280;
            --accent: #0f766e;
            --accent-strong: #0d675f;
            --on-accent: #ffffff;
            --accent-soft: rgba(15, 118, 110, 0.08);
            --divider: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181a;
                --surface: #1e1f22;
                --fg: #e6e6ea;
                --muted: #9ca3af;
                --accent: #14b8a6;
                --accent-strong: #2dd4bf;
                --on-accent: #0b1f1d;
                --accent-soft: rgba(45, 212, 191, 0.1);
                --divider: #33353a;
            }
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.55;
            color: var(--fg);
            background: var(--bg);
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 24px 48px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        header svg {
            flex: none;
            border-radius: 9px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
        }

        .intro {
            margin: 0 0 24px;
            color: var(--muted);
        }

        section {
            padding: 20px 24px;
            margin-bottom: 12px;
            border: 1px solid var(--divider);
            border-radius: 12px;
            background: var(--surface);
        }

        h2 {
            margin: 0 0 6px;
            font-size: 16.5px;
            font-weight: 600;
        }

        p {
            margin: 0;
        }

        p + p {
            margin-top: 8px;
        }

        .note {
            color: var(--muted);
            font-size: 14px;
        }

        /* The illustration is drawn on a light background, so it keeps a
           light frame in the dark theme too. */
        figure {
            margin: 16px 0 0;
            padding: 8px;
            border: 1px solid var(--divider);
            border-radius: 10px;
            background: #ffffff;
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
        }

        .calendar {
            border-color: var(--accent);
        }

        .calendar-control {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            margin-top: 14px;
            min-height: 38px;
        }

        /* Backed by the async permission state: stays hidden and
           non-interactive, with its layout preserved, until that state is
           applied. */
        .calendar-control[data-pending] {
            visibility: hidden;
            pointer-events: none;
        }

        .calendar-state {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
        }

        [hidden] {
            display: none !important;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--accent);
        }

        button {
            font: inherit;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 9px;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent-strong);
            outline-offset: 2px;
        }

        .primary {
            border: 1px solid var(--accent);
            color: var(--on-accent);
            background: var(--accent);
        }

        .primary:hover:enabled {
            background: var(--accent-strong);
        }

        .secondary {
            border: 1px solid var(--divider);
            color: var(--fg);
            background: transparent;
        }

        .secondary:hover:enabled {
            background: var(--accent-soft);
        }

        ul {
            margin: 6px 0 12px;
            padding-inline-start: 22px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
            margin-top: 20px;
            padding: 0 4px;
            font-size: 13.5px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <svg width="40" height="40" viewBox="0 0 128 128" role="img" aria-hidden="true">
                <rect width="128" height="128" rx="28" fill="#0F766E"/>
                <rect x="26" y="52" width="76" height="24" rx="12" fill="#FFFFFF"/>
                <line x1="34" y1="98" x2="94" y2="30" stroke="#0F766E" stroke-width="16" stroke-linecap="round"/>
                <line x1="34" y1="98" x2="94" y2="30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
            </svg>
            <h1 data-i18n="onboarding_title"></h1>
        </header>
        <p class="intro" data-i18n="onboarding_intro"></p>

        <section>
            <h2 data-i18n="onboarding_how_heading"></h2>
            <p data-i18n="onboarding_how_text"></p>
            <figure>
                <img src="assets/before-after.png" width="1600" height="560" data-i18n-alt="onboarding_how_image_alt">
            </figure>
        </section>

        <section class="calendar">
            <h2 data-i18n="onboarding_calendar_heading"></h2>
            <p data-i18n="onboarding_calendar_text"></p>
            <p class="note" data-i18n="onboarding_calendar_why"></p>
            <div class="calendar-control" id="calendar-control" data-pending>
                <button type="button" class="primary" id="calendar-enable" data-i18n="popup_calendar_access_label" disabled></button>
                <div class="calendar-state" id="calendar-enabled" hidden>
                    <span class="status">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span data-i18n="onboarding_calendar_enabled"></span>
                    </span>
                    <button type="button" class="secondary" id="calendar-disable" data-i18n="onboarding_calendar_disable" disabled></button>
                </div>
            </div>
        </section>

        <section>
            <h2 data-i18n="onboarding_pin_heading"></h2>
            <p data-i18n="onboarding_pin_text"></p>
        </section>

        <section>
            <h2 data-i18n="onboarding_settings_heading"></h2>
            <p data-i18n="onboarding_settings_text"></p>
        </section>

        <section>
            <h2 data-i18n="onboarding_returned_heading"></h2>
            <p data-i18n="onboarding_returned_text"></p>
        </section>

        <section>
            <h2 data-i18n="onboarding_report_heading"></h2>
            <p data-i18n="onboarding_report_text"></p>
            <ul>
                <li data-i18n="onboarding_report_item_service"></li>
                <li data-i18n="onboarding_report_item_language"></li>
                <li data-i18n="onboarding_report_item_screenshot"></li>
            </ul>
            <a href="https://github.com/maximtop/hide-gmail-upgrade-button/issues" target="_blank" rel="noreferrer" data-i18n="onboarding_report_link"></a>
        </section>

        <footer>
            <p>
                <span data-i18n="onboarding_privacy_text"></span>
                <a href="https://github.com/maximtop/hide-gmail-upgrade-button/blob/master/PRIVACY.md" target="_blank" rel="noreferrer" data-i18n="onboarding_privacy_link"></a>
            </p>
            <a href="<%= storeListingUrl %>" target="_blank" rel="noreferrer" data-i18n="onboarding_rate_link"></a>
        </footer>
    </main>
</body>
</html>
