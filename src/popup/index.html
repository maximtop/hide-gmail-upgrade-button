<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hide Upgrade Button for Gmail</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #1f1f1f;
            background: #ffffff;
        }

        main {
            width: 280px;
            padding: 16px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            cursor: pointer;
        }

        .toggle-row input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #0b57d0;
            cursor: pointer;
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: #e3e3e3;
                background: #1f1f1f;
            }

            .toggle-row input {
                accent-color: #a8c7fa;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title"></h1>
        <label class="toggle-row">
            <input type="checkbox" id="hide-upgrade">
            <span id="hide-upgrade-label"></span>
        </label>
        <label class="toggle-row">
            <input type="checkbox" id="hide-gemini">
            <span id="hide-gemini-label"></span>
        </label>
    </main>
</body>
</html>
