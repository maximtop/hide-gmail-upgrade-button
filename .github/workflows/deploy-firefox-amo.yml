name: Deploy Firefox

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (blank = latest stable release)'
        required: false
        type: string
      mode:
        description: 'Submit once, or only check review/signing status'
        required: true
        type: choice
        default: submit
        options: [submit, status]

permissions:
  contents: read

jobs:
  deploy:
    name: Firefox AMO submission or status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: firefox-amo-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GO_WEBEXT_VERSION: v0.4.2
      FIREFOX_AMO_ID: ${{ vars.FIREFOX_AMO_ID }}
      FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
      FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve and validate release assets
        id: release
        env:
          STORE_TARGET: firefox
          INPUT_TAG: ${{ inputs.tag }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: pnpm exec tsx scripts/deploy/prepare.ts
      - name: Check whether this version already exists
        if: inputs.mode == 'submit'
        id: preflight
        env:
          AMO_OPERATION: preflight
          VERSION: ${{ steps.release.outputs.version }}
        run: pnpm exec tsx scripts/deploy/firefox-cli.ts
      - name: Set up Go
        if: steps.preflight.outputs.submit == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install go-webext
        if: steps.preflight.outputs.submit == 'true'
        run: |
          go install "github.com/adguardteam/go-webext@${GO_WEBEXT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Submit with matching source and reviewer notes
        if: steps.preflight.outputs.submit == 'true'
        id: upload
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          go-webext update firefox \
            -f "store-upload/hide-gmail-upgrade-button-$VERSION-firefox.zip" \
            -s "store-upload/hide-gmail-upgrade-button-$VERSION-source.zip" \
            -c listed \
            -n "$(cat store-upload/approval-notes.txt)"
          echo 'AMO accepted the submission with matching source. Review and signing continue asynchronously.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Report review status and verify signed XPI when available
        if: always() && steps.release.outcome == 'success'
        id: status
        # An unavailable status endpoint must not invalidate an accepted submission.
        # In explicit status mode failures remain visible as failed runs.
        continue-on-error: ${{ steps.upload.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: pnpm exec tsx scripts/deploy/firefox-cli.ts
      - name: Retain verified signed package
        if: always() && steps.status.outputs.signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-signed-${{ steps.release.outputs.version }}
          path: store-upload/signed/
          if-no-files-found: error
          retention-days: 30
