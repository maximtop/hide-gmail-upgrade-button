name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-context.outputs.version }}
      tag: ${{ steps.release-context.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate version and tagged commit
        id: release-context
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not semantic: $PACKAGE_VERSION" >&2
            exit 1
          fi

          RELEASE_TAG="${RELEASE_REF#refs/tags/}"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

          git fetch origin master
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "Tagged commit must be reachable from master" >&2
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build archives and publish release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate project
        run: pnpm validate
      - name: Build release extensions
        run: pnpm release
      - name: Assemble artifacts with checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          for BROWSER in chrome edge firefox; do
            MANIFEST="build/release/$BROWSER/manifest.json"
            BUILT_VERSION="$(node -p "require('./$MANIFEST').version")"
            if [[ "$BUILT_VERSION" != "$VERSION" ]]; then
              echo "$MANIFEST version $BUILT_VERSION != $VERSION" >&2
              exit 1
            fi
          done

          DIST="release-artifacts"
          mkdir -p "$DIST"
          for BROWSER in chrome edge firefox; do
            cp "build/release/$BROWSER.zip" "$DIST/hide-gmail-upgrade-button-$VERSION-$BROWSER.zip"
          done
          git archive --format=zip -o "$DIST/hide-gmail-upgrade-button-$VERSION-source.zip" HEAD
          (cd "$DIST" && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Store-ready archives for Chrome, Edge and Firefox, plus the source archive and SHA-256 checksums. Release notes live in docs/store/STORE_LISTING.md." \
            release-artifacts/*.zip \
            release-artifacts/SHA256SUMS.txt
