name: Deploy Edge

# Manual submission only. Microsoft certifies the submission asynchronously and
# publishes a certified update itself; there is no deferred publishing on Edge.
# The first publication of the product happens in Partner Center, not here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (blank = latest stable release)'
        required: false
        type: string
      mode:
        description: 'submit = upload and request certification; upload = fill the draft only'
        required: true
        type: choice
        default: submit
        options: [submit, upload]

permissions:
  contents: read

jobs:
  deploy:
    name: Submit release archive to Microsoft Edge Add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: edge-addons-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GO_WEBEXT_VERSION: v0.4.2
      EDGE_API_VERSION: v1.1
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve and validate release assets
        id: release
        env:
          STORE_TARGET: edge
          INPUT_TAG: ${{ inputs.tag }}
          DEPLOY_MODE: ${{ inputs.mode }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: pnpm exec tsx scripts/deploy/prepare.ts

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install go-webext
        run: |
          set -euo pipefail
          go install "github.com/adguardteam/go-webext@${GO_WEBEXT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Upload the package to the draft submission
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # go-webext polls Partner Center and exits non-zero unless package
          # processing reaches Succeeded within its one-minute wait, so a
          # rejected or still-processing package never reaches the submit step.
          go-webext update edge \
            -a "$EDGE_PRODUCT_ID" \
            -f "store-upload/hide-gmail-upgrade-button-$VERSION-edge.zip" 2>&1 \
            | tee "$RUNNER_TEMP/upload-output.txt"

      - name: Submit the draft for certification
        if: inputs.mode == 'submit'
        id: submit
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          PUBLISH_OUTPUT="$RUNNER_TEMP/publish-output.txt"
          go-webext publish edge -a "$EDGE_PRODUCT_ID" 2>&1 | tee "$PUBLISH_OUTPUT"
          # go-webext v0.4.2 reads the publish operation once and prints the
          # response as an unlabeled Go struct, e.g. "&{... InProgress ...}",
          # so match the status as a whitespace-delimited word. A zero exit
          # with InProgress means the request was accepted and continues
          # asynchronously; it is not a certification verdict.
          if grep -Eq '(^|[[:space:]])Succeeded([[:space:]]|$)' "$PUBLISH_OUTPUT"; then
            STATUS="Succeeded"
          elif grep -Eq '(^|[[:space:]])InProgress([[:space:]]|$)' "$PUBLISH_OUTPUT"; then
            STATUS="InProgress"
            echo "::notice::The Edge submission was accepted and is still processing."
          else
            STATUS="Accepted (immediate status not recognized)"
            echo "::warning::The Edge submission was accepted, but its immediate" \
              "operation status was not recognized."
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Report deployment
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DEPLOY_MODE: ${{ inputs.mode }}
          SUBMISSION_STATUS: ${{ steps.submit.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "## Microsoft Edge Add-ons — $RELEASE_TAG (version $VERSION)"
            echo
            echo "- Package processing in Partner Center reached \`Succeeded\`."
            if [[ "$DEPLOY_MODE" == "submit" ]]; then
              echo "- Submission request status: \`$SUBMISSION_STATUS\`."
              echo "- Certification continues asynchronously (up to seven business days);" \
                "Microsoft publishes a certified update automatically."
            else
              echo "- Upload only: finish the draft (privacy, listings, certification notes)" \
                "and click Publish in Partner Center."
            fi
            echo "- [Open the product in Partner Center](https://partner.microsoft.com/en-us/dashboard/microsoftedge/$EDGE_PRODUCT_ID/packages/dashboard)"
            echo
            echo '```'
            head -c 8000 "$RUNNER_TEMP/upload-output.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
