name: Deploy Chrome

# Manual submission only. Publish the approved version separately in the store dashboard.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (blank = latest stable release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Submit release archive to the Chrome Web Store
    runs-on: ubuntu-latest
    concurrency:
      group: chrome-store-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GO_WEBEXT_VERSION: v0.4.2
    steps:
      - name: Check out deployment helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve and validate release
        id: release
        env:
          STORE_TARGET: chrome
          INPUT_TAG: ${{ inputs.tag }}
          CHROME_APP_ID: ${{ vars.CHROME_APP_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: pnpm exec tsx scripts/deploy/prepare.ts

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install go-webext
        run: |
          set -euo pipefail
          go install "github.com/adguardteam/go-webext@${GO_WEBEXT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Upload to Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_APP_ID: ${{ vars.CHROME_APP_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          go-webext update chrome \
            -a "$CHROME_APP_ID" \
            -f "store-upload/hide-gmail-upgrade-button-$VERSION-chrome.zip" 2>&1 \
            | tee "$RUNNER_TEMP/upload-output.txt"
          # The upload can finish asynchronously; never submit for review
          # unless the store confirmed this exact version as the draft.
          if ! grep -qxF "Upload State: SUCCEEDED" "$RUNNER_TEMP/upload-output.txt"; then
            echo "Upload did not reach SUCCEEDED; refusing to submit an unconfirmed draft." \
              "Re-run this workflow once the store finishes processing." >&2
            exit 1
          fi
          if ! grep -qxF "Version: $VERSION" "$RUNNER_TEMP/upload-output.txt"; then
            echo "Store draft version does not match release version $VERSION;" \
              "refusing to submit for review." >&2
            exit 1
          fi

      - name: Submit for review with deferred publishing
        env:
          CHROME_API_VERSION: v2
          CHROME_APP_ID: ${{ vars.CHROME_APP_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          go-webext publish chrome -a "$CHROME_APP_ID" --staged 2>&1

      - name: Report store status
        env:
          CHROME_API_VERSION: v2
          CHROME_APP_ID: ${{ vars.CHROME_APP_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          go-webext status chrome -a "$CHROME_APP_ID" 2>&1 | tee "$RUNNER_TEMP/status-output.txt"
          {
            echo "## Chrome Web Store deployment"
            echo
            echo "- Release: \`$RELEASE_TAG\` (version $VERSION)"
            echo "- The published release archive was submitted for review with deferred publishing."
            echo "- After approval, publish manually in the Developer Dashboard within 30 days."
            echo
            echo '```'
            cat "$RUNNER_TEMP/status-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
